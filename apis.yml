aid: key
name: Key
description: Key AI is a professional networking platform that rebuilds business connection-making
  around AI and consent-based introductions. Its Kai AI agent surfaces the right people through
  warm paths in your existing network, while Handshake handles consent-first introductions
  (launching summer 2026). The platform also offers matched Opportunities (jobs, deals, and
  partnerships), branded Communities and directories for alumni groups and associations,
  event and calendar pre-matching, a searchable knowledge Library, and Connectors for Slack,
  WhatsApp, and LinkedIn. Founded by Google alumni behind the 35,000-member Xoogler community
  and backed by Felicis, Key AI is an end-user and community-operator product; as of July 2026
  it publishes no public API, developer platform, or API documentation.
